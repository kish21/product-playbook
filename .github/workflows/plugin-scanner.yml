# HOL's plugin scanner on every push and pull request: read-only, no secrets, actions pinned to exact commits.
# The job is named `check`: master's ruleset requires a passing `check` before a pull request can merge.
name: Plugin Security Scan
on: [pull_request, push]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@1fb7eef6f7387abd0512e91ee8f336ac8bf07c95 # v1.2.789
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
