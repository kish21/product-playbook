# On every merge to master: if the newest CHANGELOG version has no tag yet, cut the tag and the GitHub Release from
# its CHANGELOG section, so "Latest" on the Releases page never lags master. Actions pinned to exact commits.
name: Release
on:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the tag and the release, nothing else
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # tags are needed to know whether this version is already released
          persist-credentials: false
      - name: Cut the tag and release when the newest version has none
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(python3 tools/release_notes.py --version)"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v already released - nothing to do"; exit 0
          fi
          python3 tools/release_notes.py "$v" > "$RUNNER_TEMP/notes.md"
          gh release create "v$v" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$(python3 tools/release_notes.py --title)" --notes-file "$RUNNER_TEMP/notes.md" --latest
